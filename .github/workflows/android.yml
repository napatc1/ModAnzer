name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish to the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ModAnzer.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ModAnzer.apk \
            --target "${{ github.sha }}" \
            --title "ModAnzer for Android" \
            --notes "Latest Android build (run #${{ github.run_number }}). Download ModAnzer.apk on your phone and install it."
